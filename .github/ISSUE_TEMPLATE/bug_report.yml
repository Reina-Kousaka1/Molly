name: Bug report
description: Report a reproducible problem in Molly
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Molly. Please do not include tokens, credentials, private keys, production database contents, or other secrets.
        Security vulnerabilities should be reported according to SECURITY.md instead of through a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Use command ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Discord commands / interactions
        - Moderation
        - Staff management
        - Economy
        - SeaWorld / persistence
        - Music / Lavalink
        - Docker / deployment
        - Configuration
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Molly revision
      description: Commit SHA or branch if known.
      placeholder: main / abc1234
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only redacted logs. Never include secrets or credentials.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find the same bug.
          required: true
        - label: I removed tokens, credentials, private data, and other secrets from this report.
          required: true
        - label: This is not a sensitive security vulnerability.
          required: true
