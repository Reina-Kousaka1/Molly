name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lua 5.1 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          lua5.1 -v

      - name: Run tests
        run: |
          lua5.1 tests/test.lua
          lua5.1 tests/developer_lifecycle.lua

      - name: Run economy command and ledger tests
        run: lua5.1 tests/economy_commands.lua

      - name: Run prefix command and economy tests
        run: lua5.1 tests/prefix_commands.lua

      - name: Check whitespace
        run: git diff --check
