name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, arena/b9d4658e-molly]

permissions:
  contents: read

jobs:
  test:
    name: Lua 5.1 and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          lua5.1 -v

      - name: Run CI-safe test matrix
        run: LUA_BIN=lua5.1 PYTHON_BIN=python3 tests/run_ci.sh

      - name: Check whitespace in the PR or pushed commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA...HEAD"
          else
            git diff --check HEAD
          fi
